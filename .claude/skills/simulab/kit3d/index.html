#bar button { border: 1px solid #d7d4ce; background: #fff; border-radius: 6px; padding: 5px 12px; cursor: pointer; font: inherit; }
#bar input { flex: 1; accent-color: #ec7a2f; }
body.render #bar { display: none; }
</style>
