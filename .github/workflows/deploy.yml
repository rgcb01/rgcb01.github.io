name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 */8 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync trophy data
        if: ${{ env.PSN_NPSSO != '' }}
        id: trophy_sync
        continue-on-error: true
        run: npm run sync:trophies
      - name: Report trophy sync failure
        if: ${{ steps.trophy_sync.outcome == 'failure' }}
        run: |
          echo "PSN trophy synchronization failed. The Pages build will continue with the last committed/generated safe trophy data."
          echo "If this failure happened during PSN authentication, replace the PSN_NPSSO repository secret with a fresh raw NPSSO value."
      - name: Skip trophy sync
        if: ${{ env.PSN_NPSSO == '' }}
        run: echo "PSN_NPSSO is not configured; using committed generated trophy placeholders."
      - name: Validate trophy data
        run: npm run validate:trophies
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
